<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF Editor</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1e2a32;--paper:#e9ecef;--line:#d3d9de;--accent:#2457f5;--accent-soft:#e6ecff}
html,body{height:100%}
body{font-family:'Figtree',system-ui,sans-serif;color:var(--ink);background:var(--paper);display:flex;flex-direction:column;overflow:hidden}
.topbar{background:#fff;border-bottom:1px solid var(--line);padding:.6rem 1rem;display:flex;align-items:center;gap:1rem}
.brand{font-weight:700;font-size:1.15rem;letter-spacing:-.01em}
.brand i{color:var(--accent);margin-right:.35rem}
.toolbar{background:#fff;border-bottom:1px solid var(--line);padding:.5rem 1rem;display:flex;flex-wrap:wrap;align-items:center;gap:.5rem}
.tool{border:1px solid transparent;background:none;border-radius:.5rem;padding:.35rem .7rem;font-size:.9rem;color:var(--ink);display:flex;align-items:center;gap:.4rem}
.tool:hover{background:var(--paper)}
.tool.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.sep{width:1px;height:1.6rem;background:var(--line);margin:0 .3rem}
#landing{flex:1;display:flex;align-items:center;justify-content:center;padding:1.5rem}
#drop{width:min(640px,100%);background:#fff;border:2px dashed #9aa7b1;border-radius:1rem;padding:3.5rem 1.5rem;text-align:center;transition:.15s}
#drop.over{border-color:var(--accent);background:var(--accent-soft)}
#drop h1{font-size:1.7rem;font-weight:700;margin-bottom:.4rem}
#editor{flex:1;display:none;min-height:0}
#editor.on{display:flex;flex-direction:column}
.workspace{flex:1;display:flex;min-height:0}
#thumbs{width:170px;background:#f7f8f9;border-right:1px solid var(--line);overflow-y:auto;padding:.75rem;flex-shrink:0}
.th{margin-bottom:1rem;text-align:center;font-size:.8rem}
.th canvas{width:100%;border:1px solid var(--line);background:#fff;cursor:pointer}
.th .acts{display:flex;justify-content:center;gap:.15rem;margin-top:.2rem}
.th .acts button{border:0;background:none;padding:.1rem .35rem;border-radius:.3rem;color:#5b6872}
.th .acts button:hover{background:var(--line);color:var(--ink)}
#pages{flex:1;overflow:auto;padding:1.5rem;text-align:center}
.pg{position:relative;display:inline-block;background:#fff;box-shadow:0 2px 10px rgba(30,42,50,.18);margin:0 auto 1.5rem;text-align:left}
.pg canvas{display:block}
.ov{position:absolute;inset:0;user-select:none}
.ov.draw{cursor:crosshair}.ov.place{cursor:copy}.ov.txt{cursor:text}
.it{position:absolute}
.it.sel{outline:2px solid var(--accent)}
.it.white{background:#fff}
.it.hl{background:rgba(255,230,0,.4)}
.it.rect{border:2px solid #000}
.it.img img{width:100%;height:100%;display:block;pointer-events:none}
.it.text{line-height:1;white-space:pre;min-width:12px;display:inline-block;outline:1px dashed transparent;cursor:text}
.it.text.sel{outline:2px solid var(--accent)}
.cover{position:absolute;pointer-events:none}
.hot{position:absolute;pointer-events:none;border-radius:2px}
.ov.edit .hot{pointer-events:auto;cursor:text}
.ov.edit .hot:hover{outline:1.5px solid var(--accent);background:rgba(36,87,245,.08)}
.tool.tg{padding:.3rem .55rem}
.grip,.rs{position:absolute;width:12px;height:12px;background:var(--accent);border-radius:3px;display:none}
.it.sel .grip,.it.sel .rs{display:block}
.grip{left:-14px;top:-14px;cursor:move}
.rs{right:-7px;bottom:-7px;cursor:nwse-resize}
#sigpad{border:1px solid var(--line);border-radius:.5rem;width:100%;touch-action:none;background:#fff}
#toast{position:fixed;bottom:1rem;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:.5rem 1rem;border-radius:.5rem;display:none;z-index:2000}
@media (max-width:700px){#thumbs{display:none}}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand"><i class="bi bi-file-earmark-pdf-fill"></i>PDF Editor</div>
  <div class="ms-auto d-flex gap-2">
    <button class="btn btn-outline-secondary btn-sm" id="btnOpen" style="display:none"><i class="bi bi-folder2-open"></i> Open another file</button>
    <button class="btn btn-primary btn-sm" id="btnSave" style="display:none"><i class="bi bi-download"></i> Download PDF</button>
  </div>
</div>

<div id="landing">
  <div id="drop">
    <h1>Edit your PDF in the browser</h1>
    <p class="text-secondary mb-4">Add text, images and signatures, whiteout or highlight areas, and reorder pages. Your file stays on your device.</p>
    <button class="btn btn-primary btn-lg" id="btnChoose"><i class="bi bi-upload"></i> Choose PDF file</button>
    <div class="text-secondary small mt-3">or drop a PDF here</div>
  </div>
</div>

<div id="editor">
  <div class="toolbar">
    <button class="tool active" data-tool="edit"><i class="bi bi-cursor-text"></i> Edit text</button>
    <button class="tool" data-tool="text"><i class="bi bi-fonts"></i> Add text</button>
    <button class="tool" data-tool="img"><i class="bi bi-image"></i> Image</button>
    <button class="tool" data-tool="sign"><i class="bi bi-pen"></i> Sign</button>
    <span class="sep"></span>
    <button class="tool" data-tool="white"><i class="bi bi-eraser"></i> Whiteout</button>
    <button class="tool" data-tool="hl"><i class="bi bi-highlighter"></i> Highlight</button>
    <button class="tool" data-tool="rect"><i class="bi bi-square"></i> Rectangle</button>
    <span class="sep"></span>
    <select id="ffam" class="form-select form-select-sm" style="width:150px" title="Font family">
      <option value="sans">Helvetica / Arial</option><option value="serif">Times</option><option value="mono">Courier</option></select>
    <button class="tool tg" id="fb" title="Bold"><b>B</b></button>
    <button class="tool tg" id="fi" title="Italic"><i>I</i></button>
    <span class="btn-group btn-group-sm" id="falign">
      <button class="btn btn-outline-secondary active" data-al="left" title="Align left"><i class="bi bi-text-left"></i></button>
      <button class="btn btn-outline-secondary" data-al="center" title="Align center"><i class="bi bi-text-center"></i></button>
      <button class="btn btn-outline-secondary" data-al="right" title="Align right"><i class="bi bi-text-right"></i></button></span>
    <button class="tool" id="btnFont" title="Use your own .ttf/.otf font"><i class="bi bi-file-earmark-font"></i> Font file</button>
    <label class="d-flex align-items-center gap-1 small">Size
      <input type="number" id="fsize" class="form-control form-control-sm" value="14" min="6" max="96" style="width:70px"></label>
    <label class="d-flex align-items-center gap-1 small">Color
      <input type="color" id="fcolor" class="form-control form-control-color form-control-sm" value="#000000"></label>
    <button class="tool" id="btnDel"><i class="bi bi-trash"></i> Delete / reset</button>
    <span class="sep"></span>
    <button class="tool" id="zout" title="Zoom out"><i class="bi bi-zoom-out"></i></button>
    <span id="zlabel" class="small" style="width:3rem;text-align:center">125%</span>
    <button class="tool" id="zin" title="Zoom in"><i class="bi bi-zoom-in"></i></button>
  </div>
  <div class="workspace">
    <div id="thumbs"></div>
    <div id="pages"></div>
  </div>
</div>

<input type="file" id="fileIn" accept="application/pdf" hidden>
<input type="file" id="fontIn" accept=".ttf,.otf" hidden>
<input type="file" id="imgIn" accept="image/png,image/jpeg" hidden>

<div class="modal fade" id="sigModal" tabindex="-1">
  <div class="modal-dialog"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title">Draw your signature</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body"><canvas id="sigpad" width="460" height="180"></canvas></div>
    <div class="modal-footer">
      <button class="btn btn-outline-secondary" id="sigClear">Clear</button>
      <button class="btn btn-primary" id="sigUse">Use signature</button>
    </div>
  </div></div>
</div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@pdf-lib/fontkit@1.1.1/dist/fontkit.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const S = { bytes:null, doc:null, pages:[], items:[], runs:{}, scale:1.25, tool:'edit', sel:null, uid:1, pending:null, rt:0, name:'document.pdf', custom:null };
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const sigModal = new bootstrap.Modal('#sigModal');
const ASC = 0.84; // baseline offset (fraction of font size) inside a line-height:1 box
const CSSFAM = { sans:'Helvetica,Arial,sans-serif', serif:'"Times New Roman",Times,serif', mono:'"Courier New",Courier,monospace', custom:'"CustomPDF",sans-serif' };

function toast(msg){ const t=$('#toast'); t.textContent=msg; t.style.display='block'; clearTimeout(toast.t); toast.t=setTimeout(()=>t.style.display='none',3200); }
const hex = (r,g,b) => '#' + [r,g,b].map(v => v.toString(16).padStart(2,'0')).join('');

/* ---------- Open file ---------- */
$('#btnChoose').onclick = $('#btnOpen').onclick = () => $('#fileIn').click();
$('#fileIn').onchange = e => e.target.files[0] && openFile(e.target.files[0]);
const drop = $('#drop');
['dragenter','dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave','drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => { const f=e.dataTransfer.files[0]; if(f) openFile(f); });

async function openFile(file){
  if(file.type !== 'application/pdf' && !file.name.toLowerCase().endsWith('.pdf')) return toast('Please choose a PDF file.');
  try{
    S.bytes = new Uint8Array(await file.arrayBuffer()); S.name = file.name;
    S.doc = await pdfjsLib.getDocument({ data: S.bytes.slice() }).promise;
    S.pages = []; S.items = []; S.runs = {}; S.sel = null;
    for(let i=1;i<=S.doc.numPages;i++){
      const vp = (await S.doc.getPage(i)).getViewport({ scale:1 });
      const [ox,oy] = vp.convertToPdfPoint(0, vp.height); // PDF coords of the page's bottom-left corner
      S.pages.push({ id:S.uid++, src:i-1, w:vp.width, h:vp.height, ox, oy });
    }
    $('#landing').style.display='none'; $('#editor').classList.add('on');
    $('#btnOpen').style.display = $('#btnSave').style.display = '';
    render();
  }catch(err){ console.error(err); toast('Could not open this PDF. It may be damaged or password-protected.'); }
}

/* ---------- Read the existing text of a page (grouped into editable runs) ---------- */
async function getRuns(p){
  if(S.runs[p.id]) return S.runs[p.id];
  if(p.src < 0) return S.runs[p.id] = [];
  const pg = await S.doc.getPage(p.src+1), vp = pg.getViewport({ scale:1 }), tc = await pg.getTextContent();
  const lines = [];
  for(const t of tc.items){
    if(!t.str || !t.str.trim()) continue;
    const [vx,vy] = vp.convertToViewportPoint(t.transform[4], t.transform[5]);
    const size = Math.hypot(t.transform[2], t.transform[3]);
    let name = ''; try{ name = pg.commonObjs.get(t.fontName).name || ''; }catch(e){}
    const fam = (tc.styles[t.fontName] || {}).fontFamily || '';
    const r = { x:vx, y:vy, size, w:t.width, str:t.str, key:name + '|' + fam, desc:name + ' ' + fam };
    const ln = lines.find(l => Math.abs(l.y - vy) < 2 && Math.abs(l.size - size) < .5);
    ln ? ln.items.push(r) : lines.push({ y:vy, size, items:[r] });
  }
  const runs = [];
  for(const ln of lines){
    ln.items.sort((a,b) => a.x - b.x);
    let cur = null;
    for(const n of ln.items){
      const gap = cur ? n.x - (cur.x + cur.w) : 0;
      if(cur && n.key === cur.key && gap < n.size*.8 && gap > -n.size*.5){
        cur.str += (gap > n.size*.12 && !/\s$/.test(cur.str) && !/^\s/.test(n.str) ? ' ' : '') + n.str;
        cur.w = n.x + n.w - cur.x;
      }else{ cur = { ...n }; runs.push(cur); }
    }
  }
  for(const r of runs){ // match font category, weight, style
    const d = r.desc;
    r.fam = /courier|mono|consolas|menlo/i.test(d) ? 'mono' : /sans|arial|helvet|calibri|verdana|tahoma|segoe|roboto|open|gothic/i.test(d) ? 'sans' : /times|serif|georgia|garamond|minion|palatino|cambria|roman|book/i.test(d) ? 'serif' : 'sans';
    r.bold = /bold|black|heavy|demi/i.test(d); r.italic = /italic|oblique/i.test(d);
    r.align = Math.abs(r.x + r.w/2 - p.w/2) < 3 ? 'center' : 'left'; // centred lines stay centred
  }
  return S.runs[p.id] = runs;
}

/* ---------- Render pages ---------- */
function render(){
  const token = ++S.rt, dpr = window.devicePixelRatio || 1;
  const area = $('#pages'), thumbs = $('#thumbs'), top = area.scrollTop;
  area.innerHTML = ''; thumbs.innerHTML = '';
  $('#zlabel').textContent = Math.round(S.scale*100) + '%';

  S.pages.forEach((p, i) => {
    const wrap = document.createElement('div');
    wrap.className = 'pg'; wrap.id = 'pg' + p.id;
    wrap.style.width = p.w*S.scale + 'px'; wrap.style.height = p.h*S.scale + 'px';
    const cv = document.createElement('canvas');
    cv.width = p.w*S.scale*dpr; cv.height = p.h*S.scale*dpr;
    cv.style.width = p.w*S.scale + 'px'; cv.style.height = p.h*S.scale + 'px';
    const ov = document.createElement('div'); ov.className = 'ov'; ov.dataset.pid = p.id;
    wrap.append(cv, ov); area.appendChild(wrap);
    ov.addEventListener('pointerdown', e => overlayDown(e, p, ov));

    const th = document.createElement('div'); th.className = 'th';
    th.innerHTML = `<canvas></canvas><div>${i+1}</div>
      <div class="acts">
        <button title="Move up" data-a="up"><i class="bi bi-arrow-up"></i></button>
        <button title="Move down" data-a="down"><i class="bi bi-arrow-down"></i></button>
        <button title="Insert blank page after" data-a="add"><i class="bi bi-file-earmark-plus"></i></button>
        <button title="Delete page" data-a="del"><i class="bi bi-trash"></i></button>
      </div>`;
    th.querySelector('canvas').onclick = () => wrap.scrollIntoView({ behavior:'smooth', block:'start' });
    th.querySelectorAll('button').forEach(b => b.onclick = () => pageAction(b.dataset.a, i));
    thumbs.appendChild(th);

    const ctx = cv.getContext('2d');
    const done = () => {
      if(token !== S.rt) return;
      const tc = th.querySelector('canvas'); tc.width = 140; tc.height = 140*p.h/p.w;
      tc.getContext('2d').drawImage(cv, 0, 0, tc.width, tc.height);
      getRuns(p).then(() => token === S.rt && mountHot(p));
    };
    if(p.src >= 0){
      S.doc.getPage(p.src+1).then(pg => {
        if(token !== S.rt) return;
        pg.render({ canvasContext:ctx, viewport:pg.getViewport({ scale:S.scale*dpr }) }).promise.then(done);
      });
    }else{ ctx.fillStyle = '#fff'; ctx.fillRect(0,0,cv.width,cv.height); done(); }
  });

  S.items.forEach(it => mountItem(it));
  area.scrollTop = top;
  setTool(S.tool);
}

function pageAction(a, i){
  const P = S.pages;
  if(a==='up' && i>0) [P[i-1],P[i]] = [P[i],P[i-1]];
  else if(a==='down' && i<P.length-1) [P[i+1],P[i]] = [P[i],P[i+1]];
  else if(a==='add'){ const ref=P[i]; P.splice(i+1,0,{ id:S.uid++, src:-1, w:ref.w, h:ref.h, ox:0, oy:0 }); }
  else if(a==='del'){
    if(P.length === 1) return toast('A PDF needs at least one page.');
    const [gone] = P.splice(i,1); S.items = S.items.filter(it => it.pid !== gone.id);
  }
  render();
}

/* ---------- Clickable existing text ---------- */
function mountHot(p){
  const ov = document.querySelector(`.ov[data-pid="${p.id}"]`); if(!ov) return;
  ov.querySelectorAll('.hot').forEach(h => h.remove());
  (S.runs[p.id] || []).forEach(run => {
    if(run.done) return;
    const h = document.createElement('div'); h.className = 'hot';
    h.style.left = run.x*S.scale + 'px'; h.style.top = (run.y - run.size*.9)*S.scale + 'px';
    h.style.width = run.w*S.scale + 'px'; h.style.height = run.size*1.2*S.scale + 'px';
    h.title = 'Click to edit this text';
    h.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); startEdit(p, run); });
    ov.appendChild(h);
  });
}

function sampleColors(p, run){ // read background and ink colour of the original text from the rendered page
  const cv = document.querySelector(`#pg${p.id} canvas`), f = cv.width / p.w;
  const x = Math.max(0, Math.floor(run.x*f)), y = Math.max(0, Math.floor((run.y - run.size*.9)*f));
  const w = Math.max(1, Math.min(cv.width - x, Math.ceil(run.w*f))), h = Math.max(1, Math.min(cv.height - y, Math.ceil(run.size*1.1*f)));
  const d = cv.getContext('2d').getImageData(x, y, w, h).data, count = {};
  for(let i=0;i<d.length;i+=4){ const k = (d[i]>>4)+','+(d[i+1]>>4)+','+(d[i+2]>>4); (count[k] = count[k] || { n:0, r:d[i], g:d[i+1], b:d[i+2] }).n++; }
  const bg = Object.values(count).sort((a,b) => b.n - a.n)[0];
  let ink = { r:0, g:0, b:0 }, best = -1;
  for(let i=0;i<d.length;i+=4){ const dist = Math.abs(d[i]-bg.r) + Math.abs(d[i+1]-bg.g) + Math.abs(d[i+2]-bg.b); if(dist > best){ best = dist; ink = { r:d[i], g:d[i+1], b:d[i+2] }; } }
  return { bg:hex(bg.r,bg.g,bg.b), color: best < 40 ? '#000000' : hex(ink.r,ink.g,ink.b) };
}

function startEdit(p, run){
  const c = sampleColors(p, run);
  const ax = run.align === 'center' ? run.x + run.w/2 : run.x;
  const it = { id:S.uid++, pid:p.id, type:'text', ax, y:run.y, size:run.size, fam:run.fam, bold:run.bold, italic:run.italic,
    color:c.color, align:run.align, text:run.str, orig:run.str, run,
    cover:{ x:run.x - 1, y:run.y - run.size*.92, w:run.w + 2, h:run.size*1.2, color:c.bg } };
  run.done = true; S.items.push(it); mountHot(p);
  const el = mountItem(it); select(it.id); focusEnd(el);
}
function focusEnd(el){ el.focus(); const r = document.createRange(); r.selectNodeContents(el); r.collapse(false); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }

/* ---------- Tools ---------- */
$$('.tool[data-tool]').forEach(b => b.onclick = () => {
  const t = b.dataset.tool;
  if(t === 'img') return $('#imgIn').click();
  if(t === 'sign') return openSignature();
  setTool(t);
});
function setTool(t){
  S.tool = t;
  $$('.tool[data-tool]').forEach(b => b.classList.toggle('active', b.dataset.tool === t));
  $$('.ov').forEach(o => { o.className = 'ov' + (t==='edit' ? ' edit' : ['white','hl','rect'].includes(t) ? ' draw' : t==='place' ? ' place' : t==='text' ? ' txt' : ''); });
}

$('#imgIn').onchange = e => {
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => { S.pending = { src:r.result }; setTool('place'); toast('Click on the page where the image should go.'); };
  r.readAsDataURL(f); e.target.value = '';
};

/* Signature pad */
const pad = $('#sigpad'), pctx = pad.getContext('2d'); let drawing = false;
function openSignature(){ pctx.clearRect(0,0,pad.width,pad.height); sigModal.show(); }
const padPos = e => { const r = pad.getBoundingClientRect(); return { x:(e.clientX-r.left)*pad.width/r.width, y:(e.clientY-r.top)*pad.height/r.height }; };
pad.addEventListener('pointerdown', e => { drawing = true; pad.setPointerCapture(e.pointerId); pctx.beginPath(); const p = padPos(e); pctx.moveTo(p.x,p.y); });
pad.addEventListener('pointermove', e => { if(!drawing) return; const p = padPos(e); pctx.lineWidth=3; pctx.lineCap='round'; pctx.strokeStyle='#111'; pctx.lineTo(p.x,p.y); pctx.stroke(); });
pad.addEventListener('pointerup', () => drawing = false);
$('#sigClear').onclick = () => pctx.clearRect(0,0,pad.width,pad.height);
$('#sigUse').onclick = () => { S.pending = { src: pad.toDataURL('image/png') }; sigModal.hide(); setTool('place'); toast('Click on the page where the signature should go.'); };

/* Font file (match fonts the PDF uses, e.g. Calibri) */
$('#btnFont').onclick = () => $('#fontIn').click();
$('#fontIn').onchange = async e => {
  const f = e.target.files[0]; if(!f) return;
  try{
    const bytes = new Uint8Array(await f.arrayBuffer());
    const face = new FontFace('CustomPDF', bytes.slice().buffer); await face.load(); document.fonts.add(face);
    S.custom = { bytes, name:f.name };
    let o = $('#ffam option[value="custom"]');
    if(!o){ o = document.createElement('option'); o.value = 'custom'; $('#ffam').appendChild(o); }
    o.textContent = 'Your font: ' + f.name;
    $('#ffam').value = 'custom'; applyStyle(); toast('Font loaded. It is applied to the selected text and used for new text.');
  }catch(err){ console.error(err); toast('Could not read that font file.'); }
  e.target.value = '';
};

/* ---------- Formatting controls ---------- */
const getAlign = () => $('#falign .active').dataset.al;
$('#fb').onclick = () => { $('#fb').classList.toggle('active'); applyStyle(); };
$('#fi').onclick = () => { $('#fi').classList.toggle('active'); applyStyle(); };
$$('#falign button').forEach(b => b.onclick = () => { $$('#falign button').forEach(x => x.classList.toggle('active', x === b)); applyStyle(); });
$('#ffam').onchange = $('#fsize').oninput = $('#fcolor').oninput = () => applyStyle();

function syncControls(it){
  $('#ffam').value = it.fam; $('#fsize').value = Math.round(it.size*10)/10; $('#fcolor').value = it.color;
  $('#fb').classList.toggle('active', !!it.bold); $('#fi').classList.toggle('active', !!it.italic);
  $$('#falign button').forEach(x => x.classList.toggle('active', x.dataset.al === it.align));
}
function applyStyle(){
  const it = S.items.find(x => x.id === S.sel); if(!it) return;
  if(it.type === 'text'){
    it.fam = $('#ffam').value; it.size = +$('#fsize').value || 12; it.color = $('#fcolor').value;
    it.bold = $('#fb').classList.contains('active'); it.italic = $('#fi').classList.contains('active');
    const al = getAlign();
    if(al !== it.align){
      it.align = al;
      if(it.cover){ const c = it.cover; it.ax = al==='left' ? c.x + 1 : al==='center' ? c.x + c.w/2 : c.x + c.w - 1; } // keep the original text box as the anchor
    }
  }else if(it.type === 'rect') it.color = $('#fcolor').value;
  const el = document.querySelector(`.it[data-id="${it.id}"]`); if(el) place(el, it);
}

/* ---------- Creating items ---------- */
function overlayDown(e, page, ov){
  if(e.target !== ov) return;
  const r = ov.getBoundingClientRect();
  const x = (e.clientX - r.left)/S.scale, y = (e.clientY - r.top)/S.scale;
  if(S.tool === 'edit'){ select(null); return; }

  if(S.tool === 'text'){
    const size = +$('#fsize').value || 12;
    const it = { id:S.uid++, pid:page.id, type:'text', ax:x, y:y + size*ASC, size, fam:$('#ffam').value, bold:$('#fb').classList.contains('active'),
      italic:$('#fi').classList.contains('active'), color:$('#fcolor').value, align:getAlign(), text:'' };
    S.items.push(it); const el = mountItem(it); select(it.id); el.focus(); e.preventDefault(); return;
  }
  if(S.tool === 'place' && S.pending){
    const img = new Image();
    img.onload = () => {
      const w = Math.min(160, page.w - x), h = w * img.height / img.width;
      const it = { id:S.uid++, pid:page.id, type:'img', x, y, w, h, src:S.pending.src };
      S.items.push(it); mountItem(it); select(it.id); S.pending = null; setTool('edit');
    };
    img.src = S.pending.src; return;
  }
  if(['white','hl','rect'].includes(S.tool)){
    e.preventDefault();
    const it = { id:S.uid++, pid:page.id, type:S.tool, x, y, w:1, h:1, color:$('#fcolor').value };
    const el = mountItem(it), sx = x, sy = y;
    const move = ev => {
      const cx = (ev.clientX - r.left)/S.scale, cy = (ev.clientY - r.top)/S.scale;
      it.x = Math.min(sx,cx); it.y = Math.min(sy,cy); it.w = Math.abs(cx-sx); it.h = Math.abs(cy-sy); place(el, it);
    };
    const up = () => {
      removeEventListener('pointermove', move); removeEventListener('pointerup', up);
      if(it.w < 5 || it.h < 5) return el.remove();
      S.items.push(it); select(it.id); setTool('edit');
    };
    addEventListener('pointermove', move); addEventListener('pointerup', up);
  }
}

function mountItem(it){
  const ov = document.querySelector(`.ov[data-pid="${it.pid}"]`); if(!ov) return;
  if(it.cover){ const cv = document.createElement('div'); cv.className = 'cover'; cv.dataset.cid = it.id; ov.appendChild(cv); }
  const el = document.createElement('div');
  el.className = 'it ' + it.type; el.dataset.id = it.id;
  if(it.type === 'text'){
    el.contentEditable = 'true'; el.spellcheck = false; el.textContent = it.text;
    el.addEventListener('input', () => it.text = el.innerText.replace(/\n$/, ''));
    el.addEventListener('pointerdown', e => { e.stopPropagation(); select(it.id); });
    el.addEventListener('paste', e => { e.preventDefault(); document.execCommand('insertText', false, e.clipboardData.getData('text/plain')); });
    el.addEventListener('blur', () => { if(!it.cover && !el.innerText.trim()) removeItem(it); });
    const g = document.createElement('div'); g.className = 'grip'; g.contentEditable = 'false';
    g.addEventListener('pointerdown', e => startDrag(e, el, it, 'mv')); el.appendChild(g);
  }else{
    if(it.type === 'img') el.innerHTML = `<img src="${it.src}" alt="">`;
    el.addEventListener('pointerdown', e => { if(S.tool==='edit' || S.tool==='place') startDrag(e, el, it, 'mv'); });
    const rs = document.createElement('div'); rs.className = 'rs';
    rs.addEventListener('pointerdown', e => startDrag(e, el, it, 'rs')); el.appendChild(rs);
  }
  ov.appendChild(el); place(el, it);
  if(S.sel === it.id) el.classList.add('sel');
  return el;
}

function place(el, it){
  const s = S.scale;
  if(it.type === 'text'){
    const st = el.style;
    st.left = it.ax*s + 'px'; st.top = (it.y - it.size*ASC)*s + 'px'; st.fontSize = it.size*s + 'px'; st.color = it.color;
    st.fontFamily = CSSFAM[it.fam] || CSSFAM.sans; st.fontWeight = it.bold ? '700' : '400'; st.fontStyle = it.italic ? 'italic' : 'normal';
    st.transform = it.align === 'center' ? 'translateX(-50%)' : it.align === 'right' ? 'translateX(-100%)' : 'none';
    st.textAlign = it.align;
    if(it.cover){
      const c = document.querySelector(`.cover[data-cid="${it.id}"]`), b = it.cover;
      if(c){ c.style.cssText = `left:${b.x*s}px;top:${b.y*s}px;width:${b.w*s}px;height:${b.h*s}px;background:${b.color}`; }
    }
  }else{
    el.style.left = it.x*s + 'px'; el.style.top = it.y*s + 'px'; el.style.width = it.w*s + 'px'; el.style.height = it.h*s + 'px';
    if(it.type === 'rect') el.style.borderColor = it.color;
  }
}

function startDrag(e, el, it, mode){
  e.preventDefault(); e.stopPropagation(); select(it.id);
  const sx = e.clientX, sy = e.clientY, o = { ...it };
  const move = ev => {
    const dx = (ev.clientX - sx)/S.scale, dy = (ev.clientY - sy)/S.scale;
    if(mode === 'mv'){ if(it.type === 'text'){ it.ax = o.ax + dx; } else it.x = o.x + dx; it.y = o.y + dy; }
    else{ it.w = Math.max(10, o.w + dx); it.h = Math.max(10, o.h + dy); }
    place(el, it);
  };
  const up = () => { removeEventListener('pointermove', move); removeEventListener('pointerup', up); };
  addEventListener('pointermove', move); addEventListener('pointerup', up);
}

function select(id){
  S.sel = id;
  $$('.it').forEach(el => el.classList.toggle('sel', +el.dataset.id === id));
  const it = S.items.find(x => x.id === id);
  if(it && it.type === 'text') syncControls(it);
}

function removeItem(it){ // deleting an edited line puts the original text back
  S.items = S.items.filter(x => x !== it);
  document.querySelector(`.it[data-id="${it.id}"]`)?.remove();
  document.querySelector(`.cover[data-cid="${it.id}"]`)?.remove();
  if(S.sel === it.id) S.sel = null;
  if(it.run){ it.run.done = false; mountHot(S.pages.find(p => p.id === it.pid)); }
}
function deleteSelected(){ const it = S.items.find(x => x.id === S.sel); if(it) removeItem(it); }
$('#btnDel').onclick = deleteSelected;
addEventListener('keydown', e => {
  const a = document.activeElement;
  if((e.key === 'Delete' || e.key === 'Backspace') && !a.isContentEditable && !/INPUT|TEXTAREA|SELECT/.test(a.tagName)){ e.preventDefault(); deleteSelected(); }
  if(e.key === 'Escape'){ S.pending = null; setTool('edit'); }
});

/* Zoom */
$('#zin').onclick = () => { S.scale = Math.min(3, +(S.scale + .25).toFixed(2)); render(); };
$('#zout').onclick = () => { S.scale = Math.max(.5, +(S.scale - .25).toFixed(2)); render(); };

/* ---------- Download ---------- */
$('#btnSave').onclick = async () => {
  const btn = $('#btnSave'); btn.disabled = true;
  try{
    const { PDFDocument, StandardFonts, rgb } = PDFLib;
    const rgbOf = h => rgb(parseInt(h.substr(1,2),16)/255, parseInt(h.substr(3,2),16)/255, parseInt(h.substr(5,2),16)/255);
    const src = await PDFDocument.load(S.bytes, { ignoreEncryption:true });
    const out = await PDFDocument.create();
    if(S.custom) out.registerFontkit(fontkit);
    const map = {}, fonts = {}, bad = new Set();
    const STD = { sans:['Helvetica','HelveticaBold','HelveticaOblique','HelveticaBoldOblique'], serif:['TimesRoman','TimesRomanBold','TimesRomanItalic','TimesRomanBoldItalic'], mono:['Courier','CourierBold','CourierOblique','CourierBoldOblique'] };
    const getFont = async it => {
      const custom = it.fam === 'custom' && S.custom, k = custom ? 'custom' : it.fam + (it.bold?1:0) + (it.italic?1:0);
      if(!fonts[k]) fonts[k] = custom ? await out.embedFont(S.custom.bytes, { subset:true }) : await out.embedFont(StandardFonts[STD[STD[it.fam] ? it.fam : 'sans'][(it.bold?1:0) + (it.italic?2:0)]]);
      return { font:fonts[k], unicode:!!custom };
    };

    for(const p of S.pages){
      if(p.src >= 0){ const [pg] = await out.copyPages(src, [p.src]); out.addPage(pg); map[p.id] = pg; }
      else map[p.id] = out.addPage([p.w, p.h]);
    }
    for(const it of S.items){
      const p = S.pages.find(q => q.id === it.pid), pg = map[it.pid]; if(!pg) continue;
      const X = v => p.ox + v, Y = v => p.oy + p.h - v; // page units -> PDF coordinates
      if(it.type === 'white') pg.drawRectangle({ x:X(it.x), y:Y(it.y+it.h), width:it.w, height:it.h, color:rgb(1,1,1) });
      else if(it.type === 'hl') pg.drawRectangle({ x:X(it.x), y:Y(it.y+it.h), width:it.w, height:it.h, color:rgb(1,.9,0), opacity:.4 });
      else if(it.type === 'rect') pg.drawRectangle({ x:X(it.x), y:Y(it.y+it.h), width:it.w, height:it.h, borderColor:rgbOf(it.color), borderWidth:2 });
      else if(it.type === 'img'){
        const img = it.src.startsWith('data:image/png') ? await out.embedPng(it.src) : await out.embedJpg(it.src);
        pg.drawImage(img, { x:X(it.x), y:Y(it.y+it.h), width:it.w, height:it.h });
      }else if(it.type === 'text'){
        if(it.cover && it.text === it.orig) continue; // untouched line: keep the original
        if(it.cover){ const c = it.cover; pg.drawRectangle({ x:X(c.x), y:Y(c.y+c.h), width:c.w, height:c.h, color:rgbOf(c.color) }); }
        const { font, unicode } = await getFont(it);
        for(const [i, raw] of it.text.split('\n').entries()){
          const line = unicode ? raw : [...raw].map(ch => { try{ font.encodeText(ch); return ch; }catch(e){ bad.add(ch); return '?'; } }).join(''); // keeps €, curly quotes, dashes etc.
          if(!line.trim()) continue;
          const w = font.widthOfTextAtSize(line, it.size);
          const x = it.align === 'center' ? it.ax - w/2 : it.align === 'right' ? it.ax - w : it.ax;
          pg.drawText(line, { x:X(x), y:Y(it.y + i*it.size*1.2), size:it.size, font, color:rgbOf(it.color) });
        }
      }
    }
    const blob = new Blob([await out.save()], { type:'application/pdf' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = S.name.replace(/\.pdf$/i,'') + '-edited.pdf'; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    toast(bad.size ? 'Downloaded, but these characters are not in the standard font and became ?: ' + [...bad].join(' ') + '. Load a font file (Font file button) that contains them.' : 'Edited PDF downloaded.');
  }catch(err){ console.error(err); toast('Could not save the PDF: ' + err.message); }
  btn.disabled = false;
};
</script>
</body>
